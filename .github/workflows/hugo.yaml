name: Build and publish the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0  # Blowfish needs 0.166-0.169
    steps:
      - name: Install Hugo
        run: |
          curl -sSL -o "$RUNNER_TEMP/hugo.tgz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/hugo" && tar -xzf "$RUNNER_TEMP/hugo.tgz" -C "$RUNNER_TEMP/hugo"
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - id: pages
        uses: actions/configure-pages@v5

      # Resized photos are slow to make; keep them between builds.
      - uses: actions/cache@v4
        with:
          path: resources/_gen
          key: hugo-images-${{ github.run_id }}
          restore-keys: hugo-images-

      - name: Build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --gc --minify --baseURL "${BASE_URL/#http:/https:}/"  # always https

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

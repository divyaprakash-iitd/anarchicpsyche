# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/

theme = "blowfish"
# The first build resizes ~150 large photos on a 2-core GitHub runner;
# later builds reuse the cached copies and take seconds.
timeout = "20m"
baseURL = "https://anarchicpsyche.me/"  # the deploy workflow overrides this
defaultContentLanguage = "en"

# pluralizeListTitles = "true" # hugo function useful for non-english languages, find out more in  https://gohugo.io/getting-started/configuration/#pluralizelisttitles

enableRobotsTXT = true
summaryLength = 0

buildDrafts = false
buildFuture = false

enableEmoji = true


[pagination]
  pagerSize = 100

[imaging]
  anchor = 'Center'
  resampleFilter = 'Lanczos'
  [imaging.jpeg]
    quality = 90
  [imaging.webp]
    quality = 90

# Keep the old WordPress URLs (/2020/09/03/english-confusion/)
[permalinks]
  posts = '/:year/:month/:day/:slug/'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "series"
        weight = 50

    [[related.indices]]
        name = "authors"
        weight = 20

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
      applyFilter = false
      name = 'fragmentrefs'
      type = 'fragments'
      weight = 10

# Google Analytics 4 (property "AnarchicPsyche" in DP's "My websites" account).
# Blowfish adds the tag only in production builds, so `hugo server` previews aren't counted.
[services.googleAnalytics]
  ID = "G-TPR3Q60KG7"

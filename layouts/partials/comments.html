{{/*
  Waline comments: readers comment with just a name (email optional, no account).
  Server: Vercel project "anarchicpsyche-comments" + Neon Postgres; moderate at
  <walineServerURL>/ui. Comments are keyed by page path, so keep post URLs stable.
*/}}
{{ with site.Params.walineServerURL }}
  <link rel="stylesheet" href="https://unpkg.com/@waline/client@3.16.2/dist/waline.css">
  <div id="waline"></div>
  <script type="module">
    import { init } from 'https://unpkg.com/@waline/client@3.16.2/dist/waline.js';
    init({
      el: '#waline',
      serverURL: '{{ . }}',
      path: location.pathname,
      dark: 'html.dark',
      lang: 'en',
      meta: ['nick', 'mail'],
      requiredMeta: ['nick'],
      imageUploader: false,
      search: false,
      locale: {
        nick: 'Name',
        mail: 'Email (optional)',
        placeholder: 'Leave a comment. Just your name is enough; email is optional and never shown.',
      },
    });
  </script>
{{ end }}
